[package]
name = "work-dash-app"
version = "0.1.0"
description = "work-dash 데스크톱 앱 (Tauri 2) — 로컬 대시보드 서버(localhost:4949)를 창으로 띄운다"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 개인용 앱: 용량을 줄이고 시작을 빠르게
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
