<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>work-dash</title>
<style>
  :root { --bg: #f7f7f8; --text: #1d1f24; --muted: #6b7079; --border: #e3e4e8; --accent: #3b6ef5; --error: #d93838; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171b; --text: #e6e8eb; --muted: #9198a3; --border: #2e333a; --accent: #6d97ff; --error: #ff6b6b; color-scheme: dark; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 14px;
  }
  .box { max-width: 520px; padding: 24px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 6px 0; }
  .spinner { width: 22px; height: 22px; margin: 0 auto 14px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  pre { text-align: left; white-space: pre-wrap; word-break: break-all; color: var(--error); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font: 12.5px ui-monospace, 'SF Mono', Menlo, monospace; }
  button { margin-top: 12px; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="box" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <h1>대시보드를 준비하는 중</h1>
    <p>서버가 꺼져 있으면 띄우고, 화면이 바뀌었으면 다시 빌드합니다.</p>
  </div>
  <div class="box" id="failed" hidden>
    <h1>대시보드를 열지 못했습니다</h1>
    <pre id="message"></pre>
    <p id="log"></p>
    <button id="retry" type="button">다시 시도</button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  async function prepare() {
    $('loading').hidden = false; $('failed').hidden = true;
    try {
      const { url } = await window.__TAURI__.core.invoke('prepare');
      location.replace(url);
    } catch (e) {
      $('message').textContent = e?.message ?? String(e);
      $('log').textContent = e?.log ? `서버 로그: ${e.log}` : '';
      $('loading').hidden = true; $('failed').hidden = false;
    }
  }
  $('retry').addEventListener('click', prepare);
  prepare();
</script>
</body>
</html>
